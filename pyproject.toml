[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Vision2Action"
version = "1.0.0"
description = "Vision to Language to Action robotics prototype built on MuJoCo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.1.0",
  "numpy>=1.24",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["vision2action*"]

[tool.setuptools.package-data]
vision2action = ["env/scene.xml"]
